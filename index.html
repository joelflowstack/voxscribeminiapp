<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QR Generator</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
  (function () {
    var tg = window.Telegram && window.Telegram.WebApp;
    if (!tg || !tg.initData) {
      document.write(
        '<!DOCTYPE html><html><head><meta charset="UTF-8">' +
        '<meta name="viewport" content="width=device-width, initial-scale=1.0">' +
        '<style>body{margin:0;min-height:100vh;display:flex;align-items:center;' +
        'justify-content:center;font-family:-apple-system,BlinkMacSystemFont,' +
        '"Segoe UI",Roboto,sans-serif;background:#17212b;color:#fff;text-align:center;' +
        'padding:32px;box-sizing:border-box}h2{margin:0 0 8px;font-size:19px}' +
        'p{margin:0;color:#9db1c2;font-size:14px;line-height:1.5}</style></head>' +
        '<body><div><h2>Telegram only</h2>' +
        '<p>This Mini App only works inside Telegram.<br>Please open it from your bot in the Telegram app.</p>' +
        '</div></body></html>'
      );
      document.close();
    }
  })();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #999999);
    --link: var(--tg-theme-link-color, #2481cc);
    --button: var(--tg-theme-button-color, #2481cc);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #f0f0f0);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100%;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 100px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 8px 0 4px;
  }
  p.sub {
    color: var(--hint);
    font-size: 14px;
    margin: 0 0 20px;
  }
  .tabs {
    display: flex;
    gap: 6px;
    background: var(--secondary-bg);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 18px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 8px 4px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    color: var(--hint);
    cursor: pointer;
    user-select: none;
  }
  .tab.active {
    background: var(--button);
    color: var(--button-text);
  }
  .field { margin-bottom: 14px; }
  label {
    display: block;
    font-size: 13px;
    color: var(--hint);
    margin-bottom: 6px;
  }
  input, textarea, select {
    width: 100%;
    padding: 11px 12px;
    border-radius: 10px;
    border: 1px solid var(--secondary-bg);
    background: var(--secondary-bg);
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 70px; }
  .row2 { display: flex; gap: 10px; }
  .row2 .field { flex: 1; }
  #qrOutput {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 22px 0 12px;
    padding: 20px;
    background: #ffffff;
    border-radius: 14px;
    min-height: 200px;
  }
  #qrOutput img, #qrOutput canvas { border-radius: 4px; }
  .placeholder {
    color: #bbb;
    font-size: 13px;
    text-align: center;
  }
  .actions {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }
  .btn-secondary {
    flex: 1;
    padding: 11px;
    border-radius: 10px;
    border: none;
    background: var(--secondary-bg);
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
  }
  .color-row { display: flex; gap: 10px; align-items: center; }
  .color-row input[type=color] {
    width: 44px; height: 40px; padding: 2px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>QR Code Generator</h1>
  <p class="sub">Turn a link, text, or contact into a scannable code.</p>

  <div class="tabs" id="tabs">
    <div class="tab active" data-type="url">Link</div>
    <div class="tab" data-type="text">Text</div>
    <div class="tab" data-type="wifi">Wi-Fi</div>
  </div>

  <div id="formUrl">
    <div class="field">
      <label>URL</label>
      <input type="text" id="urlInput" placeholder="https://example.com">
    </div>
  </div>

  <div id="formText" style="display:none">
    <div class="field">
      <label>Text</label>
      <textarea id="textInput" placeholder="Type anything to encode"></textarea>
    </div>
  </div>

  <div id="formWifi" style="display:none">
    <div class="field">
      <label>Network name (SSID)</label>
      <input type="text" id="wifiSsid" placeholder="My WiFi">
    </div>
    <div class="row2">
      <div class="field">
        <label>Password</label>
        <input type="text" id="wifiPass" placeholder="password">
      </div>
      <div class="field">
        <label>Security</label>
        <select id="wifiSec">
          <option value="WPA">WPA/WPA2</option>
          <option value="WEP">WEP</option>
          <option value="nopass">None</option>
        </select>
      </div>
    </div>
  </div>

  <div class="field">
    <label>Color</label>
    <div class="color-row">
      <input type="color" id="fgColor" value="#111111">
      <input type="color" id="bgColor" value="#ffffff">
      <span class="sub" style="margin:0">Foreground / background</span>
    </div>
  </div>

  <div id="qrOutput"><div class="placeholder">Your QR code appears here</div></div>

  <div class="actions">
    <button class="btn-secondary" id="downloadBtn">Download PNG</button>
    <button class="btn-secondary" id="shareBtn">Share to chat</button>
  </div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  let activeTab = 'url';
  let qr = null;
  const output = document.getElementById('qrOutput');

  document.getElementById('tabs').addEventListener('click', (e) => {
    const tab = e.target.closest('.tab');
    if (!tab) return;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeTab = tab.dataset.type;
    document.getElementById('formUrl').style.display = activeTab === 'url' ? '' : 'none';
    document.getElementById('formText').style.display = activeTab === 'text' ? '' : 'none';
    document.getElementById('formWifi').style.display = activeTab === 'wifi' ? '' : 'none';
    generate();
  });

  function buildPayload() {
    if (activeTab === 'url') {
      let v = document.getElementById('urlInput').value.trim();
      if (v && !/^https?:\/\//i.test(v)) v = 'https://' + v;
      return v;
    }
    if (activeTab === 'text') {
      return document.getElementById('textInput').value.trim();
    }
    if (activeTab === 'wifi') {
      const ssid = document.getElementById('wifiSsid').value.trim();
      const pass = document.getElementById('wifiPass').value.trim();
      const sec = document.getElementById('wifiSec').value;
      if (!ssid) return '';
      return `WIFI:T:${sec};S:${ssid};P:${pass};;`;
    }
    return '';
  }

  function generate() {
    const payload = buildPayload();
    output.innerHTML = '';
    if (!payload) {
      output.innerHTML = '<div class="placeholder">Your QR code appears here</div>';
      if (tg) tg.MainButton.hide();
      return;
    }
    qr = new QRCode(output, {
      text: payload,
      width: 220,
      height: 220,
      colorDark: document.getElementById('fgColor').value,
      colorLight: document.getElementById('bgColor').value,
      correctLevel: QRCode.CorrectLevel.M
    });
    if (tg) {
      tg.MainButton.setText('Share to chat');
      tg.MainButton.show();
    }
  }

  ['urlInput','textInput','wifiSsid','wifiPass','wifiSec','fgColor','bgColor'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('input', generate);
    el.addEventListener('change', generate);
  });

  function getCanvasDataUrl() {
    const canvas = output.querySelector('canvas');
    const img = output.querySelector('img');
    if (canvas) return canvas.toDataURL('image/png');
    if (img) return img.src;
    return null;
  }

  document.getElementById('downloadBtn').addEventListener('click', () => {
    const dataUrl = getCanvasDataUrl();
    if (!dataUrl) return;
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = 'qr-code.png';
    a.click();
  });

  document.getElementById('shareBtn').addEventListener('click', () => {
    const payload = buildPayload();
    if (!payload) return;
    if (tg) {
      tg.sendData(JSON.stringify({ type: 'qr', payload }));
    } else {
      alert('Open this inside Telegram to share.');
    }
  });

  if (tg) {
    tg.MainButton.onClick(() => {
      document.getElementById('shareBtn').click();
    });
  }

  generate();
</script>
</body>
</html>
